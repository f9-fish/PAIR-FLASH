<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1325"><title>Yoshi.Lab｜2台連動ペアワーク</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;background:#0c1325;color:#eaf0ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#263b69,transparent 40%),#0c1325}.wrap{max-width:760px;margin:auto;padding:18px 14px 60px}h1{font-size:25px}h2{font-size:18px;margin-top:0}.sub,.muted{color:#afbed8;font-size:13px;line-height:1.6}.panel{background:#17213a;border:1px solid #33476b;border-radius:18px;padding:18px;margin:15px 0}.hidden{display:none!important}button,select,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #526487;background:#101a30;color:#fff;max-width:100%}button{cursor:pointer;font-weight:750;background:#34486c}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#75b1ff;color:#081529}.green{background:#27c593;color:#04251d}.red{background:#f18a8e;color:#371116}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.field{display:grid;gap:6px;margin:12px 0}.field label{color:#bfd0ed;font-size:13px}.code{font-size:clamp(36px,9vw,62px);font-weight:900;letter-spacing:.15em;text-align:center;color:#a9d1ff}.card{border-radius:17px;background:linear-gradient(145deg,#293d68,#192843);padding:22px 18px;min-height:220px}.english{font-size:clamp(20px,4vw,28px);font-weight:700;line-height:1.7;overflow-wrap:break-word}.japanese{margin-top:18px;padding-top:16px;border-top:1px solid #60769a;font-size:17px;line-height:1.6}.blank{border-bottom:2px solid #a9c9ff;display:inline-block;min-width:3em;text-align:center}.tag{display:inline-block;background:#283e62;border-radius:100px;padding:6px 12px;font-size:13px}.stat{display:flex;justify-content:space-between;gap:8px;margin:10px 0}.status{color:#ffe2a0;font-size:13px;line-height:1.6;white-space:pre-wrap}.big{font-size:23px;font-weight:800}.judgment{font-size:clamp(34px,9vw,58px);font-weight:950;text-align:center;padding:22px 10px;border-radius:18px;margin:10px 0 18px;letter-spacing:.04em}.judgment.correct{color:#053f2b;background:#79f2bb;border:3px solid #25c78d}.judgment.incorrect{color:#5d1020;background:#ffb4bf;border:3px solid #f36d86}.answer-target{display:inline;background:transparent;color:#ffe066;font-weight:900;text-decoration:underline;text-decoration-color:#ffe066;text-decoration-thickness:2px;text-underline-offset:4px}.answer-key{font-size:13px;color:#d6e4ff;margin:10px 0 6px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}a{color:#9bc7ff}.step-label{color:#91c4ff;font-weight:800;font-size:13px;letter-spacing:.06em}.step-choice{display:block;width:100%;min-height:76px;margin:11px 0;padding:20px;text-align:left;font-size:clamp(20px,5vw,27px);font-weight:850;border:1px solid #57749e;border-radius:16px;background:#263b60}.step-choice small{display:block;font-size:13px;font-weight:500;color:#bed2f1;margin-top:6px}.step-choice:disabled{opacity:.36}.step-choice.featured{min-height:145px;background:#27c593;color:#052c23;text-align:center;font-size:36px;border-color:#27c593}.step-choice.featured small{color:#164a3c}.step-time{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.step-time .step-choice{text-align:center;min-height:80px;font-size:21px;padding:15px 5px}.step-back{background:transparent;border:1px solid #60799f;margin-bottom:16px}.step-summary{background:#101c32;border-radius:12px;padding:12px;color:#d2e4ff;line-height:1.7;margin:14px 0}.join-area{border-top:1px solid #405574;margin-top:22px;padding-top:18px}.step-choice:focus-visible{outline:3px solid #ffdc83;outline-offset:2px}</style></head><body><div class="wrap"><a href="./index.html">← 通常練習に戻る</a><h1>Yoshi.Lab <span style="color:#61dbb3">PAIR</span></h1><p class="sub">2台連動・口頭回答・5問ごとに役割交代</p><div class="row" style="margin:10px 0"><button id="soundToggle" type="button" style="flex:0 0 auto">🔇 効果音をON</button><span class="muted">各スマホで一度押してね</span></div><div id="status" class="status">Firebaseに接続しています…</div>
<section id="lobby" class="panel hidden"><div id="wizard"><div class="step-label" id="stepLabel">STEP 1 / 5</div><h2 id="stepTitle">科目を選ぼう</h2><button type="button" id="stepBack" class="step-back hidden">← 戻る</button><div id="stepChoices"></div><p class="status" id="stepMessage"></p></div><div class="join-area"><h2>参加コードを持っている人（生徒B）</h2><p class="muted">生徒Aが作った6桁のコードを入力して参加してね。</p><div class="row"><input id="joinCode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="6桁のコード" aria-label="参加コード"><button id="join">参加（生徒B）</button></div></div></section>
<section id="waiting" class="panel hidden"><h2>相手の参加を待っています</h2><div class="code" id="roomCode"></div><p class="muted">この6桁を相手に伝えてね。相手は「参加」に入力します。</p><button id="cancel" class="red">待機を終了</button></section>
<section id="game" class="hidden"><section class="panel"><div class="stat"><span id="role" class="tag"></span><span id="counter" class="tag"></span></div><div class="stat"><span>残り時間</span><strong id="timer">00:30</strong></div><div class="stat"><span>ペアの正解数</span><strong id="score">0 / 0</strong></div><div class="card"><div class="sub" id="instruction"></div><div id="english" class="english"></div><div id="answerKey" class="answer-key hidden">黄色い文字が解答箇所</div><div id="japanese" class="japanese"></div></div><p id="roleHint" class="muted"></p><div id="grading" class="split hidden"><button id="correct" class="green">○ 正解</button><button id="wrong" class="red">× 不正解</button></div><div id="feedback" class="panel hidden"><div id="feedbackTitle" class="judgment" role="status">正答確認</div><p id="feedbackAnswer" class="english"></p><button id="next" class="primary" style="width:100%">次の問題へ →</button><p id="nextHint" class="muted"></p></div></section><section id="change" class="panel hidden"><h2>🔄 役割交代！</h2><p>次の5問は出題者と回答者が入れ替わるよ。</p></section></section>
<section id="done" class="panel hidden"><h2>🎉 おつかれさま！</h2><p class="big" id="result"></p><p class="muted" id="detail"></p><button id="back" class="primary">新しいペアワークへ</button></section></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import {getDatabase,ref,onValue,runTransaction,set} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyDhm9zeUsgvF6_lbwcRj57VWXzYPA3LEzM',authDomain:'yoshi-lab-db3eb.firebaseapp.com',databaseURL:'https://yoshi-lab-db3eb-default-rtdb.firebaseio.com',projectId:'yoshi-lab-db3eb',storageBucket:'yoshi-lab-db3eb.firebasestorage.app',messagingSenderId:'543561154900',appId:'1:543561154900:web:b9ba898d1d44a385f848c1'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);
let groups=[],vocabulary=[],uid='',code='',side='',room=null,unsubscribe=null,busy=false,lastIndex=-1,localTimer=null;
let serverOffset=0,offsetReady=false,timeoutPendingIndex=-1,revealBusy=false;
const show=(id,yes)=>$(id).classList.toggle('hidden',!yes);
let soundEnabled=false,lastSoundKey='';
const soundFiles={
  correct:new Audio('./correct.wav'),
  incorrect:new Audio('./incorrect.wav')
};
for(const audio of Object.values(soundFiles)){audio.preload='auto';audio.volume=0.8}
function playJudgment(ok){
  if(!soundEnabled)return;
  const audio=soundFiles[ok?'correct':'incorrect'];
  audio.pause();audio.currentTime=0;
  audio.play().catch(()=>{});
}
$('soundToggle').onclick=async()=>{
  if(soundEnabled){
    soundEnabled=false;
    $('soundToggle').textContent='🔇 効果音をON';
    return;
  }
  // A direct tap unlocks playback on browsers that restrict audio autoplay.
  try{
    const test=soundFiles.correct;
    test.muted=true;
    await test.play();
    test.pause();test.currentTime=0;test.muted=false;
    soundEnabled=true;
    $('soundToggle').textContent='🔊 効果音ON（タップでOFF）';
    playJudgment(true);
  }catch(e){
    soundFiles.correct.muted=false;
    msg('音声を有効にできませんでした。端末の音量設定を確認してね。');
  }
};
const msg=s=>$('status').textContent=s;
const err=e=>msg('エラー：'+(e?.message||e));
const blank=s=>/\([^()]+\)/.test(s);
function showClozeForAsker(el,source){
  el.replaceChildren();
  const re=/\(([^()]+)\)/g;
  let last=0,match;
  while((match=re.exec(source))!==null){
    el.append(document.createTextNode(source.slice(last,match.index)));
    const span=document.createElement('span');
    span.className='answer-target';
    span.textContent=match[1];
    el.append(span);
    last=re.lastIndex;
  }
  el.append(document.createTextNode(source.slice(last)));
}
const lessonLabel=s=>/^lesson\b/i.test(String(s))?s:'Lesson '+s;
const partLabel=s=>/^part\b/i.test(String(s))?s:'Part '+s;
const normPart=x=>String(x??'').trim().replace(/^part\s*/i,'').trim();
const normLesson=x=>String(x??'').trim().replace(/^lesson\s*/i,'').trim();
const sortNatural=(a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true,sensitivity:'base'});
const catalog=()=>{
  const entries=new Map();
  for(const [source,list] of [['text',groups],['vocab',vocabulary]])for(const g of list){
    const subject=String(g.subject??'').trim(),id=normLesson(g.id),name=normPart(g.name);
    if(!subject||!id||!name)continue;
    const key=JSON.stringify([subject,id,name]);
    if(!entries.has(key))entries.set(key,{subject,id,name,text:[],vocab:[]});
    const entry=entries.get(key);
    if(source==='text')entry.text.push(...(g.cards||[]));
    else entry.vocab.push(...(g.words||g.cards||[]));
  }
  return [...entries.values()];
};
const vocabCards=entry=>(entry?.vocab||[]).map(w=>Array.isArray(w)?[String(w[0]??''),String(w[1]??'')]:[String(w.word??''),String(w.meaning??'')]).filter(c=>c[0]&&c[1]);
let selection={subject:'',lesson:'',part:'',mode:'',duration:0},step=0;
const steps=['科目を選ぼう','Lessonを選ぼう','Partを選ぼう','学習内容を選ぼう','制限時間を選ぼう'];
function choice(label,action,{detail='',disabled=false,featured=false}={}){
  const b=document.createElement('button');b.type='button';b.className='step-choice'+(featured?' featured':'');b.disabled=disabled;
  b.textContent=label;if(detail){const small=document.createElement('small');small.textContent=detail;b.append(small)}
  b.onclick=action;$('stepChoices').append(b);
}
function currentEntry(){return catalog().find(g=>g.subject===selection.subject&&g.id===selection.lesson&&g.name===selection.part)}
function goStep(n){step=n;renderStep()}
function renderStep(){
  $('stepLabel').textContent='STEP '+(step+1)+' / 5';$('stepTitle').textContent=steps[step];
  show('stepBack',step>0);$('stepBack').onclick=()=>goStep(step-1);
  $('stepChoices').replaceChildren();$('stepMessage').textContent='';
  const all=catalog();
  if(step===0){
    for(const s of ['英C','論表',...new Set(all.map(g=>g.subject))].filter((v,i,a)=>a.indexOf(v)===i)){
      const count=all.filter(g=>g.subject===s).length;
      choice(s,()=>{selection.subject=s;goStep(1)},{detail:count+' Part',disabled:!count});
    }
  }else if(step===1){
    const ids=[...new Set(all.filter(g=>g.subject===selection.subject).map(g=>g.id))].sort(sortNatural);
    for(const id of ids)choice(lessonLabel(id),()=>{selection.lesson=id;goStep(2)});
  }else if(step===2){
    const parts=all.filter(g=>g.subject===selection.subject&&g.id===selection.lesson).sort((a,b)=>sortNatural(a.name,b.name));
    for(const g of parts)choice(partLabel(g.name),()=>{selection.part=g.name;goStep(3)},{detail:(g.text.length?'本文 '+g.text.length+'問':'本文未登録')+' ／ '+vocabCards(g).length+'語'});
  }else if(step===3){
    const g=currentEntry();const cloze=(g?.text||[]).filter(c=>Array.isArray(c)&&blank(String(c[0]??'')));
    const words=vocabCards(g);
    choice('📖 本文穴埋め',()=>{selection.mode='cloze';goStep(4)},{detail:cloze.length?cloze.length+'問':'穴埋め問題は未登録',disabled:!cloze.length});
    choice('🔤 単語チェック',()=>{selection.mode='vocab';goStep(4)},{detail:words.length?words.length+'語・日本語を聞いて英語で回答':'単語は未登録',disabled:!words.length});
  }else{
    $('stepMessage').textContent='無制限がおすすめ！時間を気にせず口頭で回答できるよ。';
    choice('∞ 無制限',()=>createRoom(0),{detail:'おすすめ・時間を気にせず練習',featured:true});
    const row=document.createElement('div');row.className='step-time';$('stepChoices').append(row);
    for(const [seconds,label] of [[10,'10秒'],[30,'30秒'],[60,'60秒']]){
      const b=document.createElement('button');b.className='step-choice';b.textContent=label;b.onclick=()=>createRoom(seconds);row.append(b);
    }
    const summary=document.createElement('div');summary.className='step-summary';
    summary.textContent=selection.subject+' / '+lessonLabel(selection.lesson)+' / '+partLabel(selection.part)+' / '+(selection.mode==='vocab'?'単語チェック':'本文穴埋め');
    $('stepChoices').append(summary);
  }
}
async function init(){
 try{
   await signInAnonymously(auth);uid=auth.currentUser.uid;
   const [lr,vr]=await Promise.all([
     fetch('./lessons.json?t='+Date.now(),{cache:'no-store'}),
     fetch('./vocabulary.json?t='+Date.now(),{cache:'no-store'})
   ]);
   if(!lr.ok)throw Error('lessons.json が読み込めません');
   groups=await lr.json();
   if(!Array.isArray(groups))throw Error('本文データの形式が不正です');
   if(vr.ok){vocabulary=await vr.json();if(!Array.isArray(vocabulary))throw Error('単語データの形式が不正です')}
   else msg('単語データが未登録です。本文のみ利用できます。');
   if(!catalog().length)throw Error('公開問題がありません');
   renderStep();show('lobby',true);msg('接続準備OK。科目を選ぶか、参加コードを入力してね。');
 }catch(e){err(e)}
}
onValue(ref(db,'.info/serverTimeOffset'),snapshot=>{serverOffset=snapshot.val()||0;offsetReady=true;},e=>{console.warn('時刻補正の取得に失敗',e);});
const getCards=r=>{let g=catalog().find(g=>g.subject===r.subject&&g.id===normLesson(r.lesson)&&g.name===normPart(r.part));return r.mode==='vocab'?vocabCards(g):(g?.text||[]).filter(c=>r.mode!=='cloze'||blank(String(c[0]??'')))};
function watch(c){if(unsubscribe)unsubscribe();code=c;unsubscribe=onValue(ref(db,'rooms/'+c),snap=>{let r=snap.val();if(!r){msg('ペアが終了したか、部屋が見つかりません。');return}room=r;render()},err)}
async function createRoom(duration){
 if(busy)return;busy=true;
 try{
  const g=currentEntry();if(!g)throw Error('Partを選び直してください');
  const cards=selection.mode==='vocab'?vocabCards(g):(g.text||[]).filter(c=>blank(String(c[0]??'')));
  if(!cards.length)throw Error('このPartには該当する問題がありません');
  let created=false,c='';
  for(let attempt=0;attempt<8&&!created;attempt++){
   c=String(100000+Math.floor(Math.random()*900000));
   const initial={hostUid:uid,guestUid:'',subject:g.subject,lesson:String(g.id),part:String(g.name),mode:selection.mode,duration,createdAt:Date.now(),state:{index:0,right:0,total:0,startedAt:Date.now()}};
   try{await set(ref(db,'rooms/'+c),initial);created=true}
   catch(e){if(e.code!=='PERMISSION_DENIED'&&e.code!=='database/permission-denied')throw e}
  }
  if(!created)throw Error('部屋を作れませんでした。再試行してください');
  side='A';watch(c);
 }catch(e){err(e)}finally{busy=false}
}
$('join').onclick=async()=>{if(busy)return;let c=$('joinCode').value.trim();if(!/^\d{6}$/.test(c)){msg('6桁の参加コードを入力してね。');return}busy=true;try{await set(ref(db,'rooms/'+c+'/guestUid'),uid);side='B';watch(c)}catch(e){err(e)}finally{busy=false}};
function render(){if(!room)return;let joined=!!room.guestUid;show('lobby',false);show('waiting',!joined);$('roomCode').textContent=code;show('game',joined&&room.state.index<getCards(room).length);show('done',joined&&room.state.index>=getCards(room).length);if(!joined){msg('生徒Bの参加待ち');return}let cards=getCards(room);if(!cards.length){msg('この端末に該当する問題がありません。問題集の同期を確認してね。');return}let s=room.state,i=s.index;let revealed=room.reveal&&room.reveal.index===i;
if(revealed){
  const key=code+':'+i;
  if(lastSoundKey!==key){lastSoundKey=key;playJudgment(!!room.reveal.ok)}
}
msg('ペア接続中：'+code);if(i>=cards.length){$('result').textContent=s.right+' / '+s.total+' 問正解';$('detail').textContent='正答率 '+(s.total?Math.round(100*s.right/s.total):0)+'%';return}let asker=(Math.floor(i/5)%2===0?'A':'B'),answerer=asker==='A'?'B':'A',isAsker=side===asker;let [en,ja]=cards[i];$('role').textContent='あなた：生徒'+side+'（'+(isAsker?'出題者':'回答者')+'）';$('counter').textContent=(i+1)+' / '+cards.length+' 問';$('score').textContent=s.right+' / '+s.total;$('instruction').textContent=isAsker?'正解を見ながら口頭で出題し、○×を判定':'相手の出題を聞いて口頭で回答';$('roleHint').textContent=isAsker?'回答者：生徒'+answerer+'　判定すると両方の画面が進みます。':'出題者：生徒'+asker+'　回答後は相手の判定を待ってね。';show('grading',isAsker&&!revealed);show('feedback',!!revealed);$('feedbackTitle').textContent=revealed?(room.reveal.ok?'○ 正解！':'× 不正解'):'正答確認';$('feedbackTitle').className='judgment '+(revealed?(room.reveal.ok?'correct':'incorrect'):'');$('feedbackAnswer').textContent=revealed?en.replace(/\(([^()]+)\)/g,'$1'):'';show('next',!!revealed&&isAsker);$('nextHint').textContent=isAsker?'正答を確認したら次へ進もう':'出題者が「次の問題へ」を押すまで待ってね';show('change',i>0&&i%5===0&&i!==lastIndex);lastIndex=i;let text=room.mode==='cloze'?(isAsker?en.replace(/\(([^()]+)\)/g,'$1'):en.replace(/\(([^()]+)\)/g,'______')):isAsker?en:en;$('english').textContent=text;show('answerKey',room.mode==='cloze'&&isAsker);if(room.mode==='cloze'&&isAsker)showClozeForAsker($('english'),en);$('japanese').textContent=ja;if((room.mode==='normal'||room.mode==='vocab')&&!isAsker){$('english').textContent='日本語を聞いて、英語で答えよう';$('japanese').textContent=ja}if((room.mode==='normal'||room.mode==='vocab')&&isAsker)$('instruction').textContent='日本語を読み上げ、相手の英語を採点';updateTimer();}
function updateTimer(){
  if(!room||!room.guestUid)return;
  const s=room.state,secs=room.duration;
  if(room.reveal&&room.reveal.index===s.index){$('timer').textContent='確認中';return}if(!secs){$('timer').textContent='∞';return}
  const now=Date.now()+(offsetReady?serverOffset:0);
  const remaining=Math.max(0,Math.ceil((s.startedAt+secs*1000-now)/1000));
  $('timer').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
  if(!offsetReady||remaining>0||s.index>=getCards(room).length)return;
  const asker=Math.floor(s.index/5)%2===0?'A':'B';
  if(side===asker&&timeoutPendingIndex!==s.index&&!busy){
    timeoutPendingIndex=s.index;
    grade(false,true);
  }
}
async function grade(ok,timeout=false){
  if(busy||revealBusy||!room)return;
  const asker=Math.floor(room.state.index/5)%2===0?'A':'B';
  if(side!==asker)return;
  revealBusy=true;
  try{
    await set(ref(db,'rooms/'+code+'/reveal'),{index:room.state.index,ok:!!ok});
  }catch(e){timeoutPendingIndex=-1;err(e)}
  finally{revealBusy=false}
}
async function nextQuestion(){
  if(busy||!room||!room.reveal||room.reveal.index!==room.state.index)return;
  const asker=Math.floor(room.state.index/5)%2===0?'A':'B';
  if(side!==asker)return;
  busy=true;
  const oldIndex=room.state.index,ok=room.reveal.ok;
  try{
    const result=await runTransaction(ref(db,'rooms/'+code+'/state'),old=>{
      if(!old||old.index!==oldIndex)return;
      return {index:old.index+1,right:old.right+(ok?1:0),total:old.total+1,startedAt:Date.now()+(offsetReady?serverOffset:0)};
    },{applyLocally:false});
    if(!result.committed)msg('問題を進められませんでした');
  }catch(e){err(e)}
  finally{busy=false;timeoutPendingIndex=-1}
}
$('correct').onclick=()=>grade(true);
$('wrong').onclick=()=>grade(false);
$('next').onclick=nextQuestion;
localTimer=setInterval(updateTimer,300);
$('cancel').onclick=()=>location.href='./pair.html';
$('back').onclick=()=>location.href='./pair.html';
init();
</script></body></html>

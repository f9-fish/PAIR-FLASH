<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c1325"><title>Yoshi.Lab｜2台連動ペアワーク</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;background:#0c1325;color:#eaf0ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#263b69,transparent 40%),#0c1325}.wrap{max-width:760px;margin:auto;padding:18px 14px 60px}h1{font-size:25px}h2{font-size:18px;margin-top:0}.sub,.muted{color:#afbed8;font-size:13px;line-height:1.6}.panel{background:#17213a;border:1px solid #33476b;border-radius:18px;padding:18px;margin:15px 0}.hidden{display:none!important}button,select,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #526487;background:#101a30;color:#fff;max-width:100%}button{cursor:pointer;font-weight:750;background:#34486c}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:#75b1ff;color:#081529}.green{background:#27c593;color:#04251d}.red{background:#f18a8e;color:#371116}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.field{display:grid;gap:6px;margin:12px 0}.field label{color:#bfd0ed;font-size:13px}.code{font-size:clamp(36px,9vw,62px);font-weight:900;letter-spacing:.15em;text-align:center;color:#a9d1ff}.card{border-radius:17px;background:linear-gradient(145deg,#293d68,#192843);padding:22px 18px;min-height:220px}.english{font-size:clamp(20px,4vw,28px);font-weight:700;line-height:1.7;overflow-wrap:break-word}.japanese{margin-top:18px;padding-top:16px;border-top:1px solid #60769a;font-size:17px;line-height:1.6}.blank{border-bottom:2px solid #a9c9ff;display:inline-block;min-width:3em;text-align:center}.tag{display:inline-block;background:#283e62;border-radius:100px;padding:6px 12px;font-size:13px}.stat{display:flex;justify-content:space-between;gap:8px;margin:10px 0}.status{color:#ffe2a0;font-size:13px;line-height:1.6;white-space:pre-wrap}.big{font-size:23px;font-weight:800}.judgment{font-size:clamp(34px,9vw,58px);font-weight:950;text-align:center;padding:22px 10px;border-radius:18px;margin:10px 0 18px;letter-spacing:.04em}.judgment.correct{color:#053f2b;background:#79f2bb;border:3px solid #25c78d}.judgment.incorrect{color:#5d1020;background:#ffb4bf;border:3px solid #f36d86}.answer-target{display:inline;border-radius:6px;padding:2px 5px;background:#ffdf80;color:#18243d;font-weight:900;box-decoration-break:clone;-webkit-box-decoration-break:clone}.answer-key{font-size:13px;color:#d6e4ff;margin:10px 0 6px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}a{color:#9bc7ff}</style></head><body><div class="wrap"><a href="./index.html">← 通常練習に戻る</a><h1>Yoshi.Lab <span style="color:#61dbb3">PAIR</span></h1><p class="sub">2台連動・口頭回答・5問ごとに役割交代</p><div class="row" style="margin:10px 0"><button id="soundToggle" type="button" style="flex:0 0 auto">🔇 効果音をON</button><span class="muted">各スマホで一度押してね</span></div><div id="status" class="status">Firebaseに接続しています…</div>
<section id="lobby" class="panel hidden"><h2>ペアを始めよう</h2><div class="field"><label>科目</label><select id="subject"></select></div><div class="field"><label>Lesson</label><select id="lesson"></select></div><div class="field"><label>Part</label><select id="part"></select></div><div class="field"><label>問題形式</label><select id="mode"><option value="cloze">本文穴埋め</option><option value="normal">英語 → 日本語</option></select></div><div class="field"><label>1問の制限時間</label><select id="duration"><option value="10">10秒</option><option value="30" selected>30秒</option><option value="60">1分</option><option value="0">無制限</option></select></div><button class="primary" id="create" style="width:100%">ペアを作成（生徒A）</button><p class="muted">または、相手から伝えられた参加コードを入力</p><div class="row"><input id="joinCode" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="6桁のコード" aria-label="参加コード"><button id="join">参加（生徒B）</button></div></section>
<section id="waiting" class="panel hidden"><h2>相手の参加を待っています</h2><div class="code" id="roomCode"></div><p class="muted">この6桁を相手に伝えてね。相手は「参加」に入力します。</p><button id="cancel" class="red">待機を終了</button></section>
<section id="game" class="hidden"><section class="panel"><div class="stat"><span id="role" class="tag"></span><span id="counter" class="tag"></span></div><div class="stat"><span>残り時間</span><strong id="timer">00:30</strong></div><div class="stat"><span>ペアの正解数</span><strong id="score">0 / 0</strong></div><div class="card"><div class="sub" id="instruction"></div><div id="english" class="english"></div><div id="answerKey" class="answer-key hidden">黄色の部分が解答箇所</div><div id="japanese" class="japanese"></div></div><p id="roleHint" class="muted"></p><div id="grading" class="split hidden"><button id="correct" class="green">○ 正解</button><button id="wrong" class="red">× 不正解</button></div><div id="feedback" class="panel hidden"><div id="feedbackTitle" class="judgment" role="status">正答確認</div><p id="feedbackAnswer" class="english"></p><button id="next" class="primary" style="width:100%">次の問題へ →</button><p id="nextHint" class="muted"></p></div></section><section id="change" class="panel hidden"><h2>🔄 役割交代！</h2><p>次の5問は出題者と回答者が入れ替わるよ。</p></section></section>
<section id="done" class="panel hidden"><h2>🎉 おつかれさま！</h2><p class="big" id="result"></p><p class="muted" id="detail"></p><button id="back" class="primary">新しいペアワークへ</button></section></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import {getDatabase,ref,onValue,runTransaction,set} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js';
const firebaseConfig={apiKey:'AIzaSyDhm9zeUsgvF6_lbwcRj57VWXzYPA3LEzM',authDomain:'yoshi-lab-db3eb.firebaseapp.com',databaseURL:'https://yoshi-lab-db3eb-default-rtdb.firebaseio.com',projectId:'yoshi-lab-db3eb',storageBucket:'yoshi-lab-db3eb.firebasestorage.app',messagingSenderId:'543561154900',appId:'1:543561154900:web:b9ba898d1d44a385f848c1'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app),$=id=>document.getElementById(id);
let groups=[],uid='',code='',side='',room=null,unsubscribe=null,busy=false,lastIndex=-1,localTimer=null;
let serverOffset=0,offsetReady=false,timeoutPendingIndex=-1,revealBusy=false;
const show=(id,yes)=>$(id).classList.toggle('hidden',!yes);
let soundEnabled=false,lastSoundKey='';
const soundFiles={
  correct:new Audio('./correct.wav'),
  incorrect:new Audio('./incorrect.wav')
};
for(const audio of Object.values(soundFiles)){audio.preload='auto';audio.volume=0.8}
function playJudgment(ok){
  if(!soundEnabled)return;
  const audio=soundFiles[ok?'correct':'incorrect'];
  audio.pause();audio.currentTime=0;
  audio.play().catch(()=>{});
}
$('soundToggle').onclick=async()=>{
  if(soundEnabled){
    soundEnabled=false;
    $('soundToggle').textContent='🔇 効果音をON';
    return;
  }
  // A direct tap unlocks playback on browsers that restrict audio autoplay.
  try{
    const test=soundFiles.correct;
    test.muted=true;
    await test.play();
    test.pause();test.currentTime=0;test.muted=false;
    soundEnabled=true;
    $('soundToggle').textContent='🔊 効果音ON（タップでOFF）';
    playJudgment(true);
  }catch(e){
    soundFiles.correct.muted=false;
    msg('音声を有効にできませんでした。端末の音量設定を確認してね。');
  }
};
const msg=s=>$('status').textContent=s;
const err=e=>msg('エラー：'+(e?.message||e));
const blank=s=>/\([^()]+\)/.test(s);
function showClozeForAsker(el,source){
  el.replaceChildren();
  const re=/\(([^()]+)\)/g;
  let last=0,match;
  while((match=re.exec(source))!==null){
    el.append(document.createTextNode(source.slice(last,match.index)));
    const span=document.createElement('span');
    span.className='answer-target';
    span.textContent=match[1];
    el.append(span);
    last=re.lastIndex;
  }
  el.append(document.createTextNode(source.slice(last)));
}
const lessonLabel=s=>/^lesson\b/i.test(String(s))?s:'Lesson '+s;
const partLabel=s=>/^part\b/i.test(String(s))?s:'Part '+s;
const selectedGroup=()=>groups.find(g=>g.subject===$('subject').value&&String(g.id)===$('lesson').value&&String(g.name)===$('part').value);
function options(el,values,format=x=>x){el.replaceChildren();values.forEach(v=>{let o=document.createElement('option');o.value=String(v);o.textContent=format(v);el.append(o)})}
function fillSubjects(){options($('subject'),[...new Set(groups.map(g=>g.subject))]);fillLessons()}
function fillLessons(){options($('lesson'),[...new Set(groups.filter(g=>g.subject===$('subject').value).map(g=>String(g.id)))],lessonLabel);fillParts()}
function fillParts(){options($('part'),groups.filter(g=>g.subject===$('subject').value&&String(g.id)===$('lesson').value).map(g=>String(g.name)),partLabel);adjustMode()}
function adjustMode(){let g=selectedGroup();$('mode').value=g?.cards.some(c=>blank(c[0]))?'cloze':'normal'}
$('subject').onchange=fillLessons;$('lesson').onchange=fillParts;$('part').onchange=adjustMode;
async function init(){try{await signInAnonymously(auth);uid=auth.currentUser.uid;let r=await fetch('./lessons.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('lessons.json が読み込めません');groups=await r.json();if(!groups.length)throw Error('公開問題がありません');fillSubjects();show('lobby',true);msg('接続準備OK。ペアを作成するか参加してね。')}catch(e){err(e)}}
onValue(ref(db,'.info/serverTimeOffset'),snapshot=>{serverOffset=snapshot.val()||0;offsetReady=true;},e=>{console.warn('時刻補正の取得に失敗',e);});
const getCards=r=>{let g=groups.find(g=>g.subject===r.subject&&String(g.id)===String(r.lesson)&&String(g.name)===String(r.part));return (g?.cards||[]).filter(c=>r.mode!=='cloze'||blank(c[0]))};
function watch(c){if(unsubscribe)unsubscribe();code=c;unsubscribe=onValue(ref(db,'rooms/'+c),snap=>{let r=snap.val();if(!r){msg('ペアが終了したか、部屋が見つかりません。');return}room=r;render()},err)}
$('create').onclick=async()=>{if(busy)return;busy=true;try{let g=selectedGroup();if(!g)throw Error('Partを選んでください');let mode=$('mode').value,cards=g.cards.filter(c=>mode!=='cloze'||blank(c[0]));if(!cards.length)throw Error('このPartには該当する問題がありません');let created=false,c='';for(let attempt=0;attempt<8&&!created;attempt++){c=String(100000+Math.floor(Math.random()*900000));let initial={hostUid:uid,guestUid:'',subject:g.subject,lesson:String(g.id),part:String(g.name),mode,duration:Number($('duration').value),createdAt:Date.now(),state:{index:0,right:0,total:0,startedAt:Date.now()}};try{await set(ref(db,'rooms/'+c),initial);created=true}catch(e){if(e.code!=='PERMISSION_DENIED'&&e.code!=='database/permission-denied')throw e}}if(!created)throw Error('部屋を作れませんでした。再試行してください');side='A';watch(c)}catch(e){err(e)}finally{busy=false}};
$('join').onclick=async()=>{if(busy)return;let c=$('joinCode').value.trim();if(!/^\d{6}$/.test(c)){msg('6桁の参加コードを入力してね。');return}busy=true;try{await set(ref(db,'rooms/'+c+'/guestUid'),uid);side='B';watch(c)}catch(e){err(e)}finally{busy=false}};
function render(){if(!room)return;let joined=!!room.guestUid;show('lobby',false);show('waiting',!joined);$('roomCode').textContent=code;show('game',joined&&room.state.index<getCards(room).length);show('done',joined&&room.state.index>=getCards(room).length);if(!joined){msg('生徒Bの参加待ち');return}let cards=getCards(room);if(!cards.length){msg('この端末に該当する問題がありません。問題集の同期を確認してね。');return}let s=room.state,i=s.index;let revealed=room.reveal&&room.reveal.index===i;
if(revealed){
  const key=code+':'+i;
  if(lastSoundKey!==key){lastSoundKey=key;playJudgment(!!room.reveal.ok)}
}
msg('ペア接続中：'+code);if(i>=cards.length){$('result').textContent=s.right+' / '+s.total+' 問正解';$('detail').textContent='正答率 '+(s.total?Math.round(100*s.right/s.total):0)+'%';return}let asker=(Math.floor(i/5)%2===0?'A':'B'),answerer=asker==='A'?'B':'A',isAsker=side===asker;let [en,ja]=cards[i];$('role').textContent='あなた：生徒'+side+'（'+(isAsker?'出題者':'回答者')+'）';$('counter').textContent=(i+1)+' / '+cards.length+' 問';$('score').textContent=s.right+' / '+s.total;$('instruction').textContent=isAsker?'正解を見ながら口頭で出題し、○×を判定':'相手の出題を聞いて口頭で回答';$('roleHint').textContent=isAsker?'回答者：生徒'+answerer+'　判定すると両方の画面が進みます。':'出題者：生徒'+asker+'　回答後は相手の判定を待ってね。';show('grading',isAsker&&!revealed);show('feedback',!!revealed);$('feedbackTitle').textContent=revealed?(room.reveal.ok?'○ 正解！':'× 不正解'):'正答確認';$('feedbackTitle').className='judgment '+(revealed?(room.reveal.ok?'correct':'incorrect'):'');$('feedbackAnswer').textContent=revealed?en.replace(/\(([^()]+)\)/g,'$1'):'';show('next',!!revealed&&isAsker);$('nextHint').textContent=isAsker?'正答を確認したら次へ進もう':'出題者が「次の問題へ」を押すまで待ってね';show('change',i>0&&i%5===0&&i!==lastIndex);lastIndex=i;let text=room.mode==='cloze'?(isAsker?en.replace(/\(([^()]+)\)/g,'$1'):en.replace(/\(([^()]+)\)/g,'______')):isAsker?en:en;$('english').textContent=text;show('answerKey',room.mode==='cloze'&&isAsker);if(room.mode==='cloze'&&isAsker)showClozeForAsker($('english'),en);$('japanese').textContent=ja;if(room.mode==='normal'&&!isAsker){$('english').textContent='日本語を聞いて、英語で答えよう';$('japanese').textContent=ja}if(room.mode==='normal'&&isAsker)$('instruction').textContent='日本語を読み上げ、相手の英語を採点';updateTimer();}
function updateTimer(){
  if(!room||!room.guestUid)return;
  const s=room.state,secs=room.duration;
  if(room.reveal&&room.reveal.index===s.index){$('timer').textContent='確認中';return}if(!secs){$('timer').textContent='∞';return}
  const now=Date.now()+(offsetReady?serverOffset:0);
  const remaining=Math.max(0,Math.ceil((s.startedAt+secs*1000-now)/1000));
  $('timer').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
  if(!offsetReady||remaining>0||s.index>=getCards(room).length)return;
  const asker=Math.floor(s.index/5)%2===0?'A':'B';
  if(side===asker&&timeoutPendingIndex!==s.index&&!busy){
    timeoutPendingIndex=s.index;
    grade(false,true);
  }
}
async function grade(ok,timeout=false){
  if(busy||revealBusy||!room)return;
  const asker=Math.floor(room.state.index/5)%2===0?'A':'B';
  if(side!==asker)return;
  revealBusy=true;
  try{
    await set(ref(db,'rooms/'+code+'/reveal'),{index:room.state.index,ok:!!ok});
  }catch(e){timeoutPendingIndex=-1;err(e)}
  finally{revealBusy=false}
}
async function nextQuestion(){
  if(busy||!room||!room.reveal||room.reveal.index!==room.state.index)return;
  const asker=Math.floor(room.state.index/5)%2===0?'A':'B';
  if(side!==asker)return;
  busy=true;
  const oldIndex=room.state.index,ok=room.reveal.ok;
  try{
    const result=await runTransaction(ref(db,'rooms/'+code+'/state'),old=>{
      if(!old||old.index!==oldIndex)return;
      return {index:old.index+1,right:old.right+(ok?1:0),total:old.total+1,startedAt:Date.now()+(offsetReady?serverOffset:0)};
    },{applyLocally:false});
    if(!result.committed)msg('問題を進められませんでした');
  }catch(e){err(e)}
  finally{busy=false;timeoutPendingIndex=-1}
}
$('correct').onclick=()=>grade(true);
$('wrong').onclick=()=>grade(false);
$('next').onclick=nextQuestion;
localTimer=setInterval(updateTimer,300);
$('cancel').onclick=()=>location.href='./pair.html';
$('back').onclick=()=>location.href='./pair.html';
init();
</script></body></html>

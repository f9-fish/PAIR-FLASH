<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yoshi.Lab | TEACHER</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;background:#101D38;color:#f1f6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 90% 0,#263F76,transparent 48%),#101D38}main{max-width:1200px;margin:auto;padding:22px 15px 65px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:clamp(28px,5vw,38px)}h1 span{color:#6BA2FF}a{color:#8BB5FF}.panel{background:#192C50;border:1px solid #35517D;border-radius:18px;padding:18px;margin:15px 0}.muted{color:#B7CBED;font-size:13px}.filters{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}label{display:grid;gap:6px;color:#B7CBED;font-size:12px}select,input,button{font:inherit;color:#fff;background:#253E6D;border:1px solid #45659B;border-radius:10px;padding:11px;width:100%}button{cursor:pointer}button.primary{background:#528DFF;border-color:#528DFF;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{background:#253E6D;border-radius:12px;padding:14px}.metric strong{display:block;font-size:28px}.metric small{color:#B7CBED}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:790px}th,td{padding:12px 9px;border-bottom:1px solid #35517D;text-align:left;font-size:13px}th{color:#B7CBED}td button{padding:7px 10px;width:auto}tr:hover{background:#253E6D55}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{width:auto}.error{color:#ffb3b9}.edit{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}#historyList{display:grid;gap:7px}#historyList div{background:#253E6D;border-radius:8px;padding:10px;font-size:13px}@media(max-width:750px){.filters{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}.edit{grid-template-columns:1fr}}
</style></head><body><main><header><h1>Yoshi<span>.Lab</span> <small style="font-size:14px;color:#B7CBED">TEACHER</small></h1><a href="./index.html">← 学習画面へ</a></header><section class="panel"><h2>👩‍🏫 教員用ダッシュボード</h2><p id="who" class="muted">Googleログインを確認中…</p><div class="actions"><button id="login" class="primary">Googleでログイン</button><button id="logout" class="hidden">ログアウト</button><button id="reload" class="hidden">データを再読み込み</button></div><p id="status" role="status" class="muted"></p></section><div id="dashboard" class="hidden"><section class="panel"><h2>🔎 学習状況の絞り込み</h2><div class="filters"><label>組<select id="classFilter"><option value="">全クラス</option></select></label><label>科目<select id="subjectFilter"><option value="">全科目</option></select></label><label>Lesson<select id="lessonFilter"><option value="">全Lesson</option></select></label><label>Part<select id="partFilter"><option value="">全Part</option></select></label><label>学習モード<select id="modeFilter"><option value="">すべて</option><option value="text">本文穴埋め</option><option value="vocab">単語チェック</option></select></label></div></section><section class="panel"><div class="metrics"><div class="metric"><small>対象生徒数</small><strong id="students">0</strong></div><div class="metric"><small>学習した生徒</small><strong id="active">0</strong></div><div class="metric"><small>学習回数</small><strong id="sessions">0</strong></div><div class="metric"><small>平均正答率（解答数で加重）</small><strong id="accuracy">—</strong></div></div></section><section class="panel"><h2>📋 生徒別学習状況</h2><p class="muted">行を選ぶと学習履歴を表示。登録内容は「修正」から変更できます。</p><div class="scroll"><table><thead><tr><th>組</th><th>番号</th><th>氏名</th><th>学習回数</th><th>解答数</th><th>正答率</th><th>最高STREAK</th><th>最終学習日</th><th>操作</th></tr></thead><tbody id="studentsBody"></tbody></table></div></section><section id="detail" class="panel hidden"><h2 id="detailTitle">学習履歴</h2><div id="historyList"></div><h3>登録情報の修正</h3><form id="editForm" class="edit"><label>組<select id="editClass"></select></label><label>出席番号<select id="editNumber"></select></label><label>氏名<input id="editName" maxlength="60" required></label><button class="primary" type="submit">変更を保存</button></form><p id="editStatus" role="status" class="muted"></p></section></div></main><script type="module" src="./account.js"></script><script>
const $=id=>document.getElementById(id),norm=x=>String(x??'').trim().replace(/^(lesson|part)\s*/i,'').trim(),natural=(a,b)=>String(a).localeCompare(String(b),'ja',{numeric:true});let profiles={},allRecords={},teacher=false,uidSelected=null,authSerial=0;const option=(value,label)=>{const o=new Option(label,value);return o};for(let i=1;i<=5;i++){$('classFilter').add(option(String(i),i+'組'));$('editClass').add(option(String(i),i+'組'))}for(let i=1;i<=45;i++)$('editNumber').add(option(String(i),i+'番'));
function entries(uid){return Object.values(allRecords[uid]||{}).filter(r=>r&&typeof r==='object'&&Number(r.total)>0)}function matches(r){return (!$('subjectFilter').value||r.subject===$('subjectFilter').value)&&(!$('lessonFilter').value||norm(r.lesson)===$('lessonFilter').value)&&(!$('partFilter').value||norm(r.part)===$('partFilter').value)&&(!$('modeFilter').value||r.mode===$('modeFilter').value)}function fill(id,values,prefix){const el=$(id),old=el.value;el.replaceChildren(option('',prefix));for(const v of [...new Set(values)].filter(Boolean).sort(natural))el.add(option(v,(id==='lessonFilter'?'Lesson ':id==='partFilter'?'Part ':'')+v));if([...el.options].some(o=>o.value===old))el.value=old}
function refreshFilters(){const all=Object.values(allRecords).flatMap(o=>Object.values(o||{})).filter(r=>r&&typeof r==='object');fill('subjectFilter',all.map(r=>r.subject),'全科目');fill('lessonFilter',all.filter(r=>!$('subjectFilter').value||r.subject===$('subjectFilter').value).map(r=>norm(r.lesson)),'全Lesson');fill('partFilter',all.filter(r=>(!$('subjectFilter').value||r.subject===$('subjectFilter').value)&&(!$('lessonFilter').value||norm(r.lesson)===$('lessonFilter').value)).map(r=>norm(r.part)),'全Part')}
function render(){const body=$('studentsBody');body.replaceChildren();let students=0,active=0,sessions=0,correct=0,total=0;const sorted=Object.entries(profiles).filter(([uid,p])=>p&&Number(p.classNumber)>=1&&Number(p.classNumber)<=5&&(!$('classFilter').value||String(p.classNumber)===$('classFilter').value)).sort((a,b)=>Number(a[1].classNumber)-Number(b[1].classNumber)||Number(a[1].studentNumber)-Number(b[1].studentNumber)||natural(a[1].name,b[1].name));for(const [uid,p] of sorted){students++;const rec=entries(uid).filter(matches).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));const count=rec.length,questions=rec.reduce((n,r)=>n+Number(r.total||0),0),right=rec.reduce((n,r)=>n+Number(r.right||0),0),best=Math.max(0,...rec.map(r=>Number(r.bestStreak||0))),latest=rec[0]?.createdAt;active+=count>0?1:0;sessions+=count;total+=questions;correct+=right;const tr=document.createElement('tr');for(const v of [p.classNumber+'組',p.studentNumber+'番',p.name,count+'回',questions+'問',questions?Math.round(right/questions*100)+'%':'—','🔥 '+best,latest?new Date(latest).toLocaleDateString('ja-JP'):'—']){const td=document.createElement('td');td.textContent=v;tr.append(td)}const td=document.createElement('td'),btn=document.createElement('button');btn.textContent='詳細・修正';btn.onclick=()=>openDetail(uid);td.append(btn);tr.append(td);body.append(tr)}if(!students){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=9;td.textContent='対象の生徒がいません';tr.append(td);body.append(tr)}$('students').textContent=students;$('active').textContent=active;$('sessions').textContent=sessions;$('accuracy').textContent=total?Math.round(correct/total*100)+'%':'—';if(uidSelected&&profiles[uidSelected])openDetail(uidSelected,false)}
function openDetail(uid,scroll=true){uidSelected=uid;const p=profiles[uid];if(!p)return;$('detail').classList.remove('hidden');$('detailTitle').textContent=p.classNumber+'組 '+p.studentNumber+'番 '+p.name+'｜学習履歴';$('editClass').value=p.classNumber;$('editNumber').value=p.studentNumber;$('editName').value=p.name;const list=$('historyList');list.replaceChildren();const rec=entries(uid).filter(matches).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));for(const r of rec.slice(0,50)){const d=document.createElement('div'),date=r.createdAt?new Date(r.createdAt).toLocaleString('ja-JP'):'日時不明';d.textContent=date+'｜'+(r.subject||'')+' Lesson '+norm(r.lesson)+' Part '+norm(r.part)+'｜'+(r.mode==='vocab'?'単語':'本文')+'｜'+r.right+'/'+r.total+'問｜🔥'+(r.bestStreak||0);list.append(d)}if(!rec.length)list.textContent='該当する学習履歴はありません';if(scroll)$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
$('editForm').onsubmit=async e=>{e.preventDefault();if(!uidSelected)return;const btn=$('editForm').querySelector('button');btn.disabled=true;$('editStatus').textContent='保存中…';try{const p={classNumber:$('editClass').value,studentNumber:$('editNumber').value,name:$('editName').value};await window.YoshiAccount.updateStudent(uidSelected,p);profiles[uidSelected]={...profiles[uidSelected],classNumber:Number(p.classNumber),studentNumber:Number(p.studentNumber),name:p.name.trim()};$('editStatus').textContent='保存しました';render()}catch(err){$('editStatus').textContent='保存できませんでした：'+err.message}finally{btn.disabled=false}};
$('classFilter').onchange=render;$('modeFilter').onchange=render;$('subjectFilter').onchange=()=>{refreshFilters();render()};$('lessonFilter').onchange=()=>{refreshFilters();render()};$('partFilter').onchange=render;
async function load(){const a=window.YoshiAccount;if(!a?.user)return;$('status').textContent='教員権限を確認中…';try{teacher=await a.isTeacher();if(!teacher){$('status').textContent='このアカウントには教員権限がありません。Firebaseの teacherUids にUIDを登録してください。';$('dashboard').classList.add('hidden');return}$('status').textContent='学習記録を読み込み中…';const data=await a.teacherData();profiles=data.profiles;allRecords=data.records;refreshFilters();render();$('dashboard').classList.remove('hidden');$('status').textContent='読み込み完了（再読み込みボタンで最新データを取得）'}catch(err){$('status').textContent='読み込みに失敗しました：'+err.message;$('dashboard').classList.add('hidden')}}
let attached=false;function attach(){if(attached||!window.YoshiAccount)return;attached=true;const a=window.YoshiAccount;a.subscribe(async u=>{const n=++authSerial;$('who').textContent=u?(u.displayName||'Googleユーザー')+' / '+u.email:'Googleログインが必要です';$('login').classList.toggle('hidden',!!u);$('logout').classList.toggle('hidden',!u);$('reload').classList.toggle('hidden',!u);if(!u){$('dashboard').classList.add('hidden');$('status').textContent='';return}await load();if(n!==authSerial)$('dashboard').classList.add('hidden')});$('login').onclick=async()=>{try{await a.login()}catch(e){$('status').textContent=e.message}};$('logout').onclick=()=>a.logout();$('reload').onclick=load}document.addEventListener('yoshi-auth-ready',attach);if(window.YoshiAccount)attach();
</script></body></html>

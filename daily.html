<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DAILY CHALLENGE | Yoshi.Lab</title><style>
:root{color-scheme:dark;font-family:system-ui,'Noto Sans JP',sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0,#164d8d 0,transparent 45%),#06152c;color:#f2f7ff}main{max-width:760px;margin:auto;padding:24px 18px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top a{color:#d7e9ff;text-decoration:none}.brand{font-size:23px;font-weight:900}.brand span{color:#70c4ff}.panel{background:linear-gradient(145deg,#102b51,#0a1c37);border:1px solid #335781;border-radius:20px;padding:24px;margin-top:22px;box-shadow:0 15px 40px #0004}h1{font-size:clamp(28px,7vw,44px);margin:10px 0}.sub{color:#b9cbe0;line-height:1.8}.pill{display:inline-block;padding:7px 12px;border:1px solid #557cad;border-radius:30px;color:#b7e2ff;font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:22px 0}.stat{padding:15px 8px;background:#071a35;border-radius:14px;text-align:center}.stat b{display:block;font-size:23px;color:#f5d38c}.stat small{color:#b6c9df}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 18px;font-weight:800;background:#3d9df3;color:#06152c}button:disabled{opacity:.5;cursor:not-allowed}.option{width:100%;text-align:left;display:block;margin:9px 0;background:#143963;color:#fff;border:1px solid #436c98}.option:hover:not(:disabled){background:#1c518b}.option.correct{background:#17654d;border-color:#62d7a7}.option.wrong{background:#683043;border-color:#f19cab}.hidden{display:none!important}.question{font-size:clamp(25px,6vw,36px);font-weight:800;margin:18px 0}.progress{height:9px;background:#07162e;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:#4bb8ff;transition:width .2s}.result-item{padding:11px 0;border-bottom:1px solid #2b4a70;line-height:1.6}.muted{color:#aebfd4;font-size:13px}.warn{border-left:3px solid #e9bf65;padding:12px 14px;background:#6b4d182b;color:#ffe0a4;line-height:1.6;margin-top:15px}@media(max-width:420px){.panel{padding:17px}.stats{gap:6px}.stat b{font-size:20px}}
</style></head><body><main><div class="top"><a class="brand" href="./index.html">♛ Yoshi<span>.Lab</span></a><a href="./ranking.html">🏆 ランキング</a></div><section class="panel" id="welcome"><span class="pill">⚡ DAILY CHALLENGE · 試用版</span><h1>今日の10問に挑戦！</h1><p class="sub">英単語からランダムに10問を出題。全問正解を目指そう！</p><div class="stats"><div class="stat"><b>10</b><small>出題数</small></div><div class="stat"><b>2回</b><small>予定挑戦枠／日</small></div><div class="stat"><b>500</b><small>予定XP報酬</small></div></div><p id="status" class="sub">問題データを読み込み中…</p><button id="start" disabled>▶ チャレンジ開始</button><div class="warn">この版は<strong>問題と結果画面の動作確認用</strong>です。挑戦回数の制限・500 XP付与はまだ有効化していません。不正なXP獲得を防ぐため、サーバー側の検証を追加してから公開します。</div></section><section class="panel hidden" id="quiz"><span class="pill" id="count">QUESTION 1 / 10</span><div class="progress" style="margin:16px 0"><div id="bar" style="width:0%"></div></div><p class="sub">次の英単語の意味を選ぼう</p><div class="question" id="word"></div><div id="options"></div><p id="feedback" class="sub" aria-live="polite"></p><button id="next" class="hidden">次の問題へ →</button></section><section class="panel hidden" id="result"><span class="pill">MISSION RESULT</span><h1 id="score"></h1><p id="reward" class="sub"></p><h2>10問の振り返り</h2><div id="review"></div><button id="retry">もう一度挑戦</button><p class="muted">試用版では挑戦回数・XPは変化しません。</p></section></main><script>
const $=id=>document.getElementById(id);let pool=[],deck=[],index=0,answers=[],chosen=false;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
async function load(){try{const names=['vocabulary.json','ronpyo_vocab.json'];const results=await Promise.all(names.map(async n=>{const r=await fetch('./'+n,{cache:'no-store'});return r.ok?await r.json():[]}));const unique=new Map();for(const groups of results)for(const group of Array.isArray(groups)?groups:[])for(const w of group.words||[]){const word=String(w.word||'').trim(),meaning=String(w.meaning||'').trim();if(word&&meaning&&!unique.has(word+'\u0000'+meaning))unique.set(word+'\u0000'+meaning,{word,meaning})}pool=[...unique.values()];if(pool.length<13)throw Error('出題に必要な単語データが不足しています（13語以上必要）。');$('status').textContent=pool.length+'語からランダム出題できるよ！';$('start').disabled=false}catch(e){$('status').textContent='問題データを読み込めませんでした：'+e.message}};
function start(){deck=shuffle([...pool]).slice(0,10).map(w=>({word:w.word,meaning:w.meaning,options:shuffle([w.meaning,...shuffle([...new Set(pool.filter(x=>x.meaning!==w.meaning).map(x=>x.meaning))]).slice(0,3)])}));index=0;answers=[];$('welcome').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){chosen=false;const q=deck[index];$('count').textContent='QUESTION '+(index+1)+' / 10';$('bar').style.width=(index/10*100)+'%';$('word').textContent=q.word;$('feedback').textContent='';$('next').classList.add('hidden');$('options').replaceChildren();q.options.forEach(option=>{const b=document.createElement('button');b.className='option';b.textContent=option;b.onclick=()=>select(option);$('options').append(b)})}
function select(option){if(chosen)return;chosen=true;const q=deck[index],ok=option===q.meaning;answers.push({word:q.word,correct:q.meaning,selected:option,ok});for(const b of $('options').children){b.disabled=true;if(b.textContent===q.meaning)b.classList.add('correct');else if(b.textContent===option)b.classList.add('wrong')}$('feedback').textContent=ok?'✓ 正解！':'✕ 正解：'+q.meaning;$('next').textContent=index===9?'結果を見る →':'次の問題へ →';$('next').classList.remove('hidden')}
function next(){index++;if(index<10)return render();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const score=answers.filter(a=>a.ok).length;$('score').textContent=score+' / 10 正解！';$('reward').textContent=score===10?'🎉 PERFECT！本番版では500 XP獲得予定！':'惜しい！間違えた問題を復習して再挑戦しよう！';$('review').replaceChildren();answers.forEach((a,i)=>{const d=document.createElement('div');d.className='result-item';const t=document.createElement('strong');t.textContent=(a.ok?'✓ ':'✕ ')+(i+1)+'. '+a.word;const info=document.createElement('div');info.className='muted';info.textContent='君の回答：'+a.selected+' ／ 正解：'+a.correct;d.append(t,info);$('review').append(d)})}
$('start').onclick=start;$('retry').onclick=start;$('next').onclick=next;load();
</script></body></html>
